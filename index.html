<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#183b54"><title>일본 해외체험학습 | 조별 미션</title><style>
:root{--navy:#183b54;--blue:#3c83aa;--ink:#243746;--muted:#71808a;--line:#dce7eb;--bg:#f3f8f8;--white:#fff;--red:#b74b4b;--green:#277c66}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:720px;margin:auto;min-height:100dvh;padding-bottom:100px}.hero{background:linear-gradient(140deg,#173a54,#2b6b7e);color:#fff;padding:calc(28px + env(safe-area-inset-top)) 22px 27px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}.hero:after{content:'✿';position:absolute;right:18px;top:8px;font-size:100px;opacity:.10}.eyebrow{font-size:12px;letter-spacing:.13em;opacity:.78;font-weight:750}.hero h1{font-size:26px;line-height:1.3;margin:8px 0}.hero p{font-size:14px;opacity:.88;margin:0}.wrap{padding:18px 16px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:15px;box-shadow:0 5px 16px #19374a08}.card h2{font-size:17px;margin:0 0 12px}.muted{font-size:13px;color:var(--muted)}.field{margin:13px 0}.field label,.field legend{display:block;font-size:14px;font-weight:750;margin-bottom:7px}input[type=text],textarea,input[type=number]{width:100%;padding:12px 13px;border:1.5px solid #cfdee4;border-radius:12px;background:#fff;color:var(--ink);outline:none}input:focus,textarea:focus{border-color:#3c83aa;box-shadow:0 0 0 3px #3c83aa18}textarea{min-height:95px;resize:vertical}input::placeholder,textarea::placeholder{color:#9ca9af}.daytabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.daytabs button{border:1px solid var(--line);background:#f6fafb;border-radius:12px;padding:12px 3px;color:#526773;font-weight:750}.daytabs button.active{background:var(--navy);border-color:var(--navy);color:white}.places{display:grid;gap:9px}.place{width:100%;text-align:left;display:flex;gap:10px;align-items:center;background:white;border:1.5px solid var(--line);border-radius:14px;padding:12px;color:var(--ink)}.place.active{border-color:#2b7796;background:#f0f9fc}.num{display:grid;place-items:center;background:#eaf3f6;color:#2b6b84;width:32px;height:32px;border-radius:10px;font-size:13px;font-weight:800;flex-shrink:0}.place .name{font-weight:750;flex:1}.status{font-size:11px;color:#7a8b93;white-space:nowrap}.status.done{color:var(--green);font-weight:800}.notice{border-radius:13px;padding:13px 14px;background:#edf6fa;color:#245c77;font-size:13px;margin:12px 0}.notice.error{background:#fff0ee;color:#a44440}.notice.success{background:#e9f7f1;color:#24715c}.q{margin:18px 0}.qtitle{font-size:14px;font-weight:760;margin:0 0 8px}.qnum{font-size:11px;color:#307ca0;font-weight:850;margin-right:5px}.photo{border:1.5px dashed #b6ccd5;border-radius:14px;padding:12px;margin:10px 0}.photo input{display:block;width:100%;font-size:13px;margin-top:7px}.preview{width:100%;max-height:190px;object-fit:cover;border-radius:9px;margin-top:8px}.small{font-size:12px;color:#72828a}.btn{border:0;border-radius:13px;padding:14px 18px;font-weight:800;background:var(--navy);color:white;width:100%;min-height:49px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{background:#e7f0f4;color:#28556a}.footer{text-align:center;font-size:12px;color:#7b8c95;padding:8px 16px 26px}.tag{display:inline-block;border-radius:8px;background:#eaf2f5;color:#477185;padding:3px 9px;font-size:11px;font-weight:800}.hidden{display:none!important}.progress{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:13px}.bar{height:7px;background:#e6eef1;border-radius:10px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#5ca98d;width:0%;transition:width .25s}.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,#f3f8f8 22%);padding:16px 0 max(8px,env(safe-area-inset-bottom))}.spinner{display:inline-block;width:16px;height:16px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}@media(min-width:650px){.hero{border-radius:0 0 30px 30px}.wrap{padding:24px}.places{grid-template-columns:1fr 1fr}} </style></head><body><main class="shell"><header class="hero"><div class="eyebrow">JAPAN FIELD TRIP · GROUP MISSIONS</div><h1>우리 조의 일본 미션 ✈️</h1><p>관찰하고, 기록하고, 사진으로 추억을 남겨요.</p></header><div class="wrap"><section class="card"><h2>① 우리 조 정보</h2><div class="field"><label for="team">조 번호</label><input id="team" type="number" min="1" max="99" inputmode="numeric" placeholder="예: 2" autocomplete="off"></div><div class="field"><label for="members">참여 조원 전체 이름</label><input id="members" type="text" placeholder="예: 김민수, 이서연, 박지훈" autocomplete="off"><div class="small">대표 제출자도 포함해 모든 조원의 이름을 쉼표로 구분하세요.</div></div><button class="btn secondary" id="check">우리 조 제출 현황 확인</button><div id="teamMessage" aria-live="polite"></div><div class="progress"><span>우리 조 미션 완료</span><strong id="count">0 / 9</strong></div><div class="bar"><div class="fill" id="fill"></div></div></section><section class="card"><h2>② 방문 장소 선택</h2><div class="daytabs" id="daytabs"><button class="active" data-day="1">1일차</button><button data-day="2">2일차</button><button data-day="3">3일차</button></div><div class="places" id="places"></div></section><section class="card" id="missionCard"><h2 id="missionTitle">③ 미션 수행</h2><div id="missionContent"></div></section><div class="sticky"><button class="btn" id="submit" disabled>미션 제출하기</button></div><div class="footer">사진은 교사용 비공개 저장소에 보관됩니다. 타인의 얼굴을 허락 없이 촬영하지 마세요.</div></div></main><script>
// Google Apps Script 웹 앱 배포 URL을 아래에 입력하세요.
const API_URL='PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';
const missions=[
{id:'odaiba',day:1,name:'오다이바 해변공원',questions:[{label:'다리에서 나타나는 특징을 한 가지 적어보자.',kind:'text'},{label:'바다 건너편에서 보이는 건물이나 시설을 한 가지 적어보자.',kind:'text'}],photos:1,photoHint:'조원들과 함께 현장에서 촬영한 인증 사진 1장'},
{id:'asakusa',day:1,name:'아사쿠사 관음사와 나카미세도리',questions:[{label:'사람들이 본당 앞에서 주로 하는 행동은 무엇인지 적어보자.',kind:'text'},{label:'이곳의 절과 우리나라의 절에서 비슷한 점과 다른 점을 각각 적어보자.',kind:'split',parts:['비슷한 점','다른 점']}],photos:1,photoHint:'가미나리몬의 거대한 등불에 적힌 ‘雷門’ 한자가 보이도록 촬영한 사진 1장'},
{id:'utokyo',day:2,name:'도쿄대학',questions:[{label:'도쿄대 학생과의 대화를 통해 알게 된 점을 3가지 적어보자.',kind:'split',parts:['첫 번째','두 번째','세 번째']},{label:'내가 도쿄대 학생이라면 무엇을 공부해 보고 싶은지 적고, 그 이유를 한 줄로 적어보자.',kind:'split',parts:['공부해 보고 싶은 것','그 이유']}],photos:1,photoHint:'조원들과 함께 도쿄대학에서 촬영한 사진 1장'},
{id:'museum',day:2,name:'국립과학박물관',questions:[{label:'전시된 유물 가운데 가장 크다고 생각한 것을 찾아 이름을 기록해 보자.',kind:'text'},{label:'일본관에서 일본 열도의 자연환경을 보여주는 전시물을 한 가지 찾아보자.',kind:'text'},{label:'일본에서 발견된 후타바사우루스를 찾아, 어떤 환경에서 살았을지 추측해 보자.',kind:'text'}],photos:1,photoHint:'가장 인상 깊게 관찰한 전시물 사진 1장 (촬영 허용 구역만)'},
{id:'ueno',day:2,name:'우에노 공원',questions:[{label:'공원에 전시된 사이고 다카모리와 우리나라의 관련성을 찾아 적어보자. (AI·검색·안내문 활용 가능)',kind:'text'},{label:'공원 안에서 전통적인 건축물을 하나 찾아 이름을 적어보자.',kind:'text'}],photos:1,photoHint:'공원 안에서 발견한 전통 건축물을 배경으로 촬영한 사진 1장'},
{id:'warner',day:2,name:'워너브라더스 스튜디오',questions:[],photos:3,photoHint:'조원들과 함께 즐겁게 촬영한 단체 인증 사진 3장'},
{id:'owakudani',day:3,name:'오와쿠다니 계곡',questions:[{label:'계곡 전체적으로 나타나는 땅의 색깔을 관찰해 적어보자.',kind:'text'},{label:'주변의 평범한 산과 오와쿠다니의 다른 점을 한 가지 적어보자.',kind:'text'},{label:'이곳의 달걀 껍데기가 검은 이유는 무엇일지 추측해 보자.',kind:'text'}],photos:1,photoHint:'조원 전원의 얼굴이 나오는 단체 사진 1장 (배경 제한 없음)'},
{id:'hakone',day:3,name:'하코네 신사',questions:[{label:'1일차에 방문한 아사쿠사 관음사와의 차이점을 2가지 적어보자.',kind:'split',parts:['첫 번째 차이점','두 번째 차이점']},{label:'일본 사람들이 신사에서 참배하는 모습을 관찰하고, 순서를 간단히 기록해 보자.',kind:'text'}],photos:1,photoHint:'아시노코 호수의 모습이 담긴 사진 1장 (조원 얼굴 불필요)'},
{id:'skytree',day:3,name:'도쿄 스카이트리 전망대',questions:[],photos:1,photoHint:'조원 전원의 얼굴이 나오는 단체 사진 1장'}
];
let day=1,selected='odaiba',completed=new Set(),verifiedTeam='',loading=false,photoFiles=[];
const $=id=>document.getElementById(id),escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const teamKey=()=>String(Number($('team').value||0));const members=()=>$('members').value.split(/[,，、\n]+/).map(s=>s.trim()).filter(Boolean);
function message(text,type='error'){ $('teamMessage').innerHTML=text?`<div class="notice ${type}">${escapeHTML(text)}</div>`:'' }
function updateProgress(){ $('count').textContent=`${completed.size} / ${missions.length}`;$('fill').style.width=`${completed.size/missions.length*100}%` }
function renderPlaces(){ $('places').innerHTML=missions.filter(m=>m.day===day).map((m,i)=>`<button class="place ${m.id===selected?'active':''}" data-id="${m.id}"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="name">${escapeHTML(m.name)}</span><span class="status ${completed.has(m.id)?'done':''}">${completed.has(m.id)?'✓ 제출 완료':'미제출'}</span></button>`).join('');$('places').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.id;renderPlaces();renderMission()}));updateProgress()}
function renderMission(){const m=missions.find(x=>x.id===selected);$('missionTitle').textContent=`③ ${m.name}`;const done=completed.has(m.id);if(done){$('missionContent').innerHTML='<div class="notice success"><strong>이미 제출 완료한 장소입니다.</strong><div>같은 조에서는 이 장소의 미션을 다시 제출할 수 없습니다.</div></div>';$('submit').disabled=true;$('submit').textContent='제출 완료';return}let html=`<span class="tag">${m.day}일차 · ${m.questions.length?'질문 '+m.questions.length+'개':'질문 없음'}</span>`;if(!m.questions.length)html+='<div class="notice">이번 장소는 질문 없이 인증 사진만 제출하면 돼요. 즐겁게 관람하세요!</div>';m.questions.forEach((q,i)=>{html+=`<div class="q"><p class="qtitle"><span class="qnum">질문 ${i+1}</span>${escapeHTML(q.label)}</p>`;if(q.kind==='split')q.parts.forEach((p,j)=>html+=`<div class="field"><label for="ans-${i}-${j}">${escapeHTML(p)}</label><textarea id="ans-${i}-${j}" data-question="${i}" data-part="${j}" maxlength="2000" placeholder="답변을 작성하세요."></textarea></div>`);else html+=`<textarea id="ans-${i}" data-question="${i}" maxlength="2000" placeholder="답변을 작성하세요."></textarea>`;html+='</div>'});html+=`<div class="q"><p class="qtitle">📷 인증 사진 ${m.photos}장</p><p class="small">${escapeHTML(m.photoHint)}</p>`;for(let i=0;i<m.photos;i++)html+=`<div class="photo"><label for="photo-${i}">사진 ${i+1} · 필수</label><input type="file" id="photo-${i}" data-photo="${i}" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" capture="environment"><div class="small" id="photomsg-${i}">사진을 선택하거나 촬영하세요.</div><img class="preview hidden" id="preview-${i}" alt="첨부한 사진 미리보기"></div>`;html+='</div><div id="submitMessage" aria-live="polite"></div>';$('missionContent').innerHTML=html;photoFiles=new Array(m.photos).fill(null);$('missionContent').querySelectorAll('textarea').forEach(el=>el.addEventListener('input',validate));$('missionContent').querySelectorAll('input[type=file]').forEach(el=>el.addEventListener('change',async()=>{const n=Number(el.dataset.photo);const f=el.files?.[0];photoFiles[n]=f||null;const img=$('preview-'+n);if(f){$('photomsg-'+n).textContent=`선택됨: ${f.name} (${(f.size/1024/1024).toFixed(1)}MB)`;if(f.type.startsWith('image/')){img.src=URL.createObjectURL(f);img.classList.remove('hidden')}else img.classList.add('hidden')}else{img.classList.add('hidden');$('photomsg-'+n).textContent='사진을 선택하세요.'}validate()}));validate()}
function validate(){const m=missions.find(x=>x.id===selected);const allAnswers=[...$('missionContent').querySelectorAll('textarea')].every(el=>el.value.trim());$('submit').disabled=loading||completed.has(selected)||verifiedTeam!==teamKey()||!members().length||!allAnswers||photoFiles.length!==m.photos||photoFiles.some(f=>!f);$('submit').textContent=loading?'제출 중…':'미션 제출하기'}
$('daytabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{day=Number(b.dataset.day);selected=missions.find(m=>m.day===day).id;$('daytabs').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));renderPlaces();renderMission()}));
$('team').addEventListener('input',()=>{verifiedTeam='';completed=new Set();renderPlaces();renderMission();message('조 번호를 입력한 뒤 제출 현황 확인 버튼을 눌러주세요.','info')});$('members').addEventListener('input',validate);
async function api(payload){if(window.google && google.script && google.script.run){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(data=>data&&data.ok?resolve(data):reject(Error(data?.error||'처리 중 오류가 발생했습니다.'))).withFailureHandler(e=>reject(Error(e.message||String(e)))).handleRequest(payload))}if(!API_URL.startsWith('https://script.google.com/'))throw Error('관리자가 이메일 제출 서버를 아직 연결하지 않았습니다.');const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});if(!res.ok)throw Error('서버 연결에 실패했습니다.');const data=await res.json();if(!data.ok)throw Error(data.error||'처리 중 오류가 발생했습니다.');return data}
$('check').addEventListener('click',async()=>{if(!/^[1-9]\d?$/.test(teamKey())){message('1~99 사이의 조 번호를 입력하세요.');return}const btn=$('check');btn.disabled=true;btn.textContent='확인 중…';try{const data=await api({action:'status',team:teamKey()});completed=new Set(data.completed||[]);verifiedTeam=teamKey();message(`${teamKey()}조 제출 현황을 불러왔습니다.`,'success');renderPlaces();renderMission()}catch(e){verifiedTeam='';message(e.message);validate()}finally{btn.disabled=false;btn.textContent='우리 조 제출 현황 확인'}});
function imageData(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{try{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve({mimeType:'image/jpeg',data:canvas.toDataURL('image/jpeg',.78).split(',')[1],name:file.name.replace(/\.[^.]+$/,'')+'.jpg'})}catch(e){reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('사진을 읽을 수 없습니다. JPG 또는 PNG 사진으로 다시 선택해주세요.'))};img.src=url})}
$('submit').addEventListener('click',async()=>{validate();if($('submit').disabled)return;const m=missions.find(x=>x.id===selected);if(!confirm(`${teamKey()}조의 '${m.name}' 미션을 제출할까요?\n제출 후에는 수정하거나 다시 제출할 수 없습니다.`))return;loading=true;validate();$('submit').innerHTML='<span class="spinner"></span>사진 처리 및 제출 중…';try{const answers=m.questions.map((q,i)=>({question:q.label,answer:q.kind==='split'?q.parts.map((p,j)=>`${p}: ${$('ans-'+i+'-'+j).value.trim()}`).join('\n'):$('ans-'+i).value.trim()}));const photos=await Promise.all(photoFiles.map(imageData));const data=await api({action:'submit',team:teamKey(),members:members(),missionId:m.id,answers,photos});completed=new Set(data.completed||[...completed,m.id]);renderPlaces();renderMission();message('미션이 정상적으로 제출되었습니다!','success');window.scrollTo({top:0,behavior:'smooth'})}catch(e){if(e.message.includes('이미 제출')){completed.add(m.id);renderPlaces();renderMission()}else{const out=$('submitMessage');if(out)out.innerHTML=`<div class="notice error">${escapeHTML(e.message)}</div>`;alert(e.message)}}finally{loading=false;validate()}});
renderPlaces();renderMission();message('처음 이용할 때 조 번호를 입력하고 제출 현황을 확인하세요.','info');
</script></body></html>
